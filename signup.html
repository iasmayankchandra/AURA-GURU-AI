<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Join AURA GURU — Create Account</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(212,175,55,0.10), transparent 35%),
        radial-gradient(circle at bottom right, rgba(212,175,55,0.06), transparent 35%),
        #050505;
      color: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    .container {
      width: 100%;
      max-width: 460px;
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #ffffff;
    }

    .logo span {
      color: #d4af37;
    }

    .tagline {
      margin-top: 8px;
      color: #999;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .card {
      background: rgba(18,18,18,0.94);
      border: 1px solid rgba(212,175,55,0.22);
      border-radius: 24px;
      padding: 38px 32px;
      box-shadow:
        0 25px 70px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.04);
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #cfcfcf;
      margin-bottom: 8px;
    }

    .field {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 15px 16px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #0c0c0c;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: 0.2s ease;
    }

    input:focus {
      border-color: #d4af37;
      box-shadow: 0 0 0 3px rgba(212,175,55,0.08);
    }

    .button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(135deg, #d4af37, #f0d77a);
      color: #080808;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s ease;
      margin-top: 5px;
    }

    .button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 30px rgba(212,175,55,0.18);
    }

    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
    }

    .success {
      display: block;
      background: rgba(60,180,100,0.10);
      border: 1px solid rgba(60,180,100,0.30);
      color: #8ee6a8;
    }

    .error {
      display: block;
      background: rgba(220,70,70,0.10);
      border: 1px solid rgba(220,70,70,0.30);
      color: #ff9c9c;
    }

    .login-link {
      text-align: center;
      margin-top: 24px;
      color: #888;
      font-size: 14px;
    }

    .login-link a {
      color: #d4af37;
      text-decoration: none;
      font-weight: 700;
    }

    .back {
      text-align: center;
      margin-top: 22px;
    }

    .back a {
      color: #777;
      text-decoration: none;
      font-size: 13px;
    }

    .back a:hover {
      color: #d4af37;
    }

    @media (max-width: 500px) {
      .card {
        padding: 30px 22px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="brand">
      <div class="logo">
        AURA <span>GURU</span>
      </div>

      <div class="tagline">
        Your Personal AI Mentor
      </div>
    </div>

    <div class="card">

      <h1>Create Your Account</h1>

      <p class="subtitle">
        Begin your journey with AURA GURU and build
        clarity, discipline and direction.
      </p>

      <form id="signupForm">

        <div class="field">
          <label for="name">Your Name</label>

          <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required
          >
        </div>

        <div class="field">
          <label for="email">Email Address</label>

          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>

          <input
            type="password"
            id="password"
            placeholder="Create a password"
            minlength="6"
            required
          >
        </div>

        <button
          type="submit"
          class="button"
          id="signupButton"
        >
          Create My Account →
        </button>

      </form>

      <div id="message" class="message"></div>

      <div class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
      </div>

    </div>

    <div class="back">
      <a href="index.html">← Back to AURA GURU</a>
    </div>

  </div>


  <script>

    // YOUR EXISTING SUPABASE PROJECT
    const SUPABASE_URL =
      "https://siatoghkuuummtrhfxlx.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_2gqa3zniT2SIzd8uaBs3Rw_1_1BvM-F";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    const form =
      document.getElementById("signupForm");

    const button =
      document.getElementById("signupButton");

    const message =
      document.getElementById("message");


    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      const name =
        document.getElementById("name").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      if (!name || !email || !password) {

        showMessage(
          "Please fill in all fields.",
          "error"
        );

        return;
      }


      button.disabled = true;

      button.textContent =
        "Creating your account...";

      message.className = "message";


      try {

        const { data, error } =
          await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {
              data: {
                full_name: name
              }
            }

          });


        if (error) {
          throw error;
        }


        showMessage(
          "Account created successfully. Please check your email and verify your account before logging in.",
          "success"
        );


        form.reset();


        button.disabled = false;

        button.textContent =
          "Account Created ✓";


      } catch (error) {

        console.error(error);

        showMessage(
          error.message ||
          "Unable to create your account. Please try again.",
          "error"
        );


        button.disabled = false;

        button.textContent =
          "Create My Account →";

      }

    });

  </script>

</body>
</html>
