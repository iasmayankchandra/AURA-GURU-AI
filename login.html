<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA GURU | Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at 50% 20%, #3a2a08 0%, #0b0b0b 35%, #000 75%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 460px;
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand h1 {
      font-size: 38px;
      letter-spacing: 5px;
      color: #d4af37;
    }

    .brand p {
      margin-top: 8px;
      color: #aaa;
      font-size: 14px;
    }

    .card {
      background: rgba(15,15,15,.92);
      border: 1px solid rgba(212,175,55,.35);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 25px 80px rgba(0,0,0,.65);
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      border: 1px solid #333;
      border-radius: 12px;
      background: #111;
      color: #aaa;
      cursor: pointer;
      font-weight: bold;
    }

    .tab.active {
      background: #d4af37;
      color: #000;
      border-color: #d4af37;
    }

    h2 {
      margin-bottom: 8px;
      font-size: 27px;
    }

    .sub {
      color: #999;
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #ccc;
      font-size: 13px;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #080808;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #d4af37;
    }

    .main-btn {
      width: 100%;
      padding: 15px;
      margin-top: 8px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(135deg, #f1d675, #d4af37);
      color: #000;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
    }

    .main-btn:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      display: block;
      background: rgba(20,130,70,.15);
      border: 1px solid rgba(50,200,110,.4);
      color: #8ff0b5;
    }

    .error {
      display: block;
      background: rgba(180,40,40,.15);
      border: 1px solid rgba(255,80,80,.4);
      color: #ff9b9b;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #aaa;
      text-decoration: none;
      font-size: 13px;
    }

    .back:hover {
      color: #d4af37;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="brand">
      <h1>AURA</h1>
      <p>Your Personal AI Guru</p>
    </div>

    <div class="card">

      <div class="tabs">
        <button id="loginTab" class="tab active" onclick="showLogin()">
          LOGIN
        </button>

        <button id="signupTab" class="tab" onclick="showSignup()">
          CREATE ACCOUNT
        </button>
      </div>

      <!-- LOGIN -->
      <div id="loginForm">

        <h2>Welcome Back</h2>
        <p class="sub">
          Continue your journey with AURA GURU.
        </p>

        <div class="field">
          <label>Email</label>
          <input id="loginEmail" type="email" placeholder="Enter your email">
        </div>

        <div class="field">
          <label>Password</label>
          <input id="loginPassword" type="password" placeholder="Enter your password">
        </div>

        <button id="loginButton" class="main-btn" onclick="loginUser()">
          LOGIN TO AURA
        </button>

      </div>

      <!-- SIGNUP -->
      <div id="signupForm" class="hidden">

        <h2>Create Your AURA</h2>
        <p class="sub">
          Start building your personal AI-guided growth journey.
        </p>

        <div class="field">
          <label>Full Name</label>
          <input id="signupName" type="text" placeholder="Your name">
        </div>

        <div class="field">
          <label>Email</label>
          <input id="signupEmail" type="email" placeholder="Your email">
        </div>

        <div class="field">
          <label>Password</label>
          <input id="signupPassword" type="password" placeholder="Minimum 6 characters">
        </div>

        <button id="signupButton" class="main-btn" onclick="createAccount()">
          CREATE MY AURA
        </button>

      </div>

      <div id="message" class="message"></div>

      <a href="index.html" class="back">
        ← Back to AURA GURU
      </a>

    </div>
  </div>


  <script>

    /* =====================================================
       SUPABASE CONFIGURATION
       ===================================================== */

    const SUPABASE_URL = "https://siatoghkuuummtrhfxlx.supabase.co/rest/v1/";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_2gqa3zniT2SIzd8uaBs3Rw_1_1BvM-F";


    /* =====================================================
       SUPABASE CLIENT
       ===================================================== */

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


    /* =====================================================
       MESSAGE
       ===================================================== */

    function showMessage(text, type) {

      const box = document.getElementById("message");

      box.textContent = text;

      box.className = "message " + type;
    }


    /* =====================================================
       TABS
       ===================================================== */

    function showLogin() {

      document.getElementById("loginForm").classList.remove("hidden");

      document.getElementById("signupForm").classList.add("hidden");

      document.getElementById("loginTab").classList.add("active");

      document.getElementById("signupTab").classList.remove("active");

      document.getElementById("message").className = "message";
    }


    function showSignup() {

      document.getElementById("loginForm").classList.add("hidden");

      document.getElementById("signupForm").classList.remove("hidden");

      document.getElementById("loginTab").classList.remove("active");

      document.getElementById("signupTab").classList.add("active");

      document.getElementById("message").className = "message";
    }


    /* =====================================================
       CREATE ACCOUNT
       ===================================================== */

    async function createAccount() {

      const name =
        document.getElementById("signupName").value.trim();

      const email =
        document.getElementById("signupEmail").value.trim();

      const password =
        document.getElementById("signupPassword").value;

      const button =
        document.getElementById("signupButton");


      if (!name || !email || !password) {

        showMessage(
          "Please fill all the fields.",
          "error"
        );

        return;
      }


      if (password.length < 6) {

        showMessage(
          "Password must contain at least 6 characters.",
          "error"
        );

        return;
      }


      button.disabled = true;

      button.textContent = "CREATING...";


      try {

        const { data, error } =
          await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {
              data: {
                full_name: name
              }
            }

          });


        if (error) {

          showMessage(
            error.message,
            "error"
          );

          button.disabled = false;

          button.textContent = "CREATE MY AURA";

          return;
        }


        if (data.user) {

          showMessage(
            "Account created successfully! Check your email to verify your account.",
            "success"
          );

        }

      } catch (err) {

        showMessage(
          "Something went wrong. Please try again.",
          "error"
        );

      }


      button.disabled = false;

      button.textContent = "CREATE MY AURA";
    }


    /* =====================================================
       LOGIN
       ===================================================== */

    async function loginUser() {

      const email =
        document.getElementById("loginEmail").value.trim();

      const password =
        document.getElementById("loginPassword").value;

      const button =
        document.getElementById("loginButton");


      if (!email || !password) {

        showMessage(
          "Please enter email and password.",
          "error"
        );

        return;
      }


      button.disabled = true;

      button.textContent = "LOGGING IN...";


      try {

        const { data, error } =
          await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

          });


        if (error) {

          showMessage(
            error.message,
            "error"
          );

          button.disabled = false;

          button.textContent = "LOGIN TO AURA";

          return;
        }


        if (data.session) {

          showMessage(
            "Login successful! Dashboard connection is next.",
            "success"
          );

          /*
            NEXT STEP:
            We will redirect this to dashboard.html
            after the dashboard is ready.
          */

        }

      } catch (err) {

        showMessage(
          "Something went wrong. Please try again.",
          "error"
        );

      }


      button.disabled = false;

      button.textContent = "LOGIN TO AURA";
    }

  </script>

</body>
</html>
