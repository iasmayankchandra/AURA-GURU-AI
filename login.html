<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AURA GURU | Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 20%, rgba(212,175,55,.18), transparent 32%),
        linear-gradient(135deg,#020202,#0c0c0c,#020202);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .orb {
      position: fixed;
      width: 430px;
      height: 430px;
      border-radius: 50%;
      background: radial-gradient(circle,
        rgba(255,255,255,.15),
        rgba(212,175,55,.10),
        transparent 70%);
      filter: blur(5px);
    }

    .container {
      width: 100%;
      max-width: 440px;
      padding: 20px;
      position: relative;
      z-index: 2;
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand h1 {
      color: #d4af37;
      letter-spacing: 5px;
      font-size: 34px;
    }

    .brand p {
      color: #999;
      font-size: 12px;
      margin-top: 8px;
      letter-spacing: 1px;
    }

    .card {
      background: rgba(15,15,15,.92);
      border: 1px solid rgba(212,175,55,.25);
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 25px 80px rgba(0,0,0,.65);
      backdrop-filter: blur(20px);
    }

    .tabs {
      display: flex;
      background: #080808;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 28px;
    }

    .tab {
      width: 50%;
      border: none;
      padding: 12px;
      border-radius: 9px;
      background: transparent;
      color: #888;
      cursor: pointer;
      font-weight: 600;
    }

    .tab.active {
      background: linear-gradient(135deg,#c9a227,#f2d66d);
      color: #050505;
    }

    h2 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #888;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      color: #bbb;
      font-size: 12px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 11px;
      border: 1px solid #292929;
      background: #090909;
      color: white;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #d4af37;
      box-shadow: 0 0 0 3px rgba(212,175,55,.08);
    }

    .main-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg,#c9a227,#f2d66d);
      color: #050505;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
    }

    .main-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 16px;
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
      color: #ccc;
    }

    .back {
      text-align: center;
      margin-top: 22px;
    }

    .back a {
      color: #999;
      text-decoration: none;
      font-size: 12px;
    }

    .hidden {
      display: none;
    }

    @media(max-width:500px) {
      .card {
        padding: 28px 20px;
      }

      .brand h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

<div class="orb"></div>

<div class="container">

  <div class="brand">
    <h1>AURA GURU</h1>
    <p>YOUR PERSONAL AI MENTOR</p>
  </div>

  <div class="card">

    <div class="tabs">
      <button class="tab active" id="loginTab" onclick="showLogin()">
        Login
      </button>

      <button class="tab" id="signupTab" onclick="showSignup()">
        Create Account
      </button>
    </div>

    <!-- LOGIN -->

    <div id="loginForm">

      <h2>Welcome Back</h2>

      <p class="subtitle">
        Continue your journey with AURA GURU.
      </p>

      <div class="field">
        <label>Email Address</label>
        <input id="loginEmail" type="email" placeholder="Enter your email">
      </div>

      <div class="field">
        <label>Password</label>
        <input id="loginPassword" type="password" placeholder="Enter your password">
      </div>

      <button class="main-btn" id="loginBtn" onclick="loginUser()">
        Enter AURA GURU
      </button>

      <div id="loginMessage" class="message"></div>

    </div>


    <!-- SIGNUP -->

    <div id="signupForm" class="hidden">

      <h2>Begin Your Journey</h2>

      <p class="subtitle">
        Create your AURA GURU account and start building your next version.
      </p>

      <div class="field">
        <label>Full Name</label>
        <input id="signupName" type="text" placeholder="Enter your name">
      </div>

      <div class="field">
        <label>Email Address</label>
        <input id="signupEmail" type="email" placeholder="Enter your email">
      </div>

      <div class="field">
        <label>Create Password</label>
        <input id="signupPassword" type="password" placeholder="Create a password">
      </div>

      <button class="main-btn" id="signupBtn" onclick="createAccount()">
        Create My AURA
      </button>

      <div id="signupMessage" class="message"></div>

    </div>

    <div class="back">
      <a href="index.html">← Back to AURA GURU</a>
    </div>

  </div>

</div>


<script>

  /* =====================================================
     SUPABASE CONNECTION
     ===================================================== */

  const SUPABASE_URL = "https://siatoghkuuummtrhfxlx.supabase.co/rest/v1/";

  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_2gqa3zniT2SIzd8uaBs3Rw_1_1BvM-F";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


  /* =====================================================
     LOGIN / SIGNUP TABS
     ===================================================== */

  function showLogin() {

    document.getElementById("loginForm").classList.remove("hidden");
    document.getElementById("signupForm").classList.add("hidden");

    document.getElementById("loginTab").classList.add("active");
    document.getElementById("signupTab").classList.remove("active");
  }


  function showSignup() {

    document.getElementById("loginForm").classList.add("hidden");
    document.getElementById("signupForm").classList.remove("hidden");

    document.getElementById("loginTab").classList.remove("active");
    document.getElementById("signupTab").classList.add("active");
  }


  /* =====================================================
     CREATE ACCOUNT
     ===================================================== */

  async function createAccount() {

    const name =
      document.getElementById("signupName").value.trim();

    const email =
      document.getElementById("signupEmail").value.trim();

    const password =
      document.getElementById("signupPassword").value;

    const message =
      document.getElementById("signupMessage");

    const button =
      document.getElementById("signupBtn");


    if (!name || !email || !password) {

      message.textContent =
        "Please fill all fields.";

      return;
    }


    if (password.length < 6) {

      message.textContent =
        "Password must be at least 6 characters.";

      return;
    }


    button.disabled = true;

    message.textContent =
      "Creating your AURA GURU account...";


    try {

      const { data, error } =
        await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {
            data: {
              full_name: name
            }
          }

        });


      if (error) {
        throw error;
      }


      if (data.user) {

        message.textContent =
          "Account created successfully. Please check your email to confirm your account.";

      }

    } catch (error) {

      message.textContent =
        error.message;

    } finally {

      button.disabled = false;

    }

  }


  /* =====================================================
     LOGIN
     ===================================================== */

  async function loginUser() {

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;

    const message =
      document.getElementById("loginMessage");

    const button =
      document.getElementById("loginBtn");


    if (!email || !password) {

      message.textContent =
        "Please enter your email and password.";

      return;
    }


    button.disabled = true;

    message.textContent =
      "Signing you in...";


    try {

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({

          email: email,

          password: password

        });


      if (error) {
        throw error;
      }


      message.textContent =
        "Login successful. Welcome to AURA GURU!";

      /*
        Dashboard will be connected in the next step.
      */

    } catch (error) {

      message.textContent =
        error.message;

    } finally {

      button.disabled = false;

    }

  }

</script>

</body>
</html>
