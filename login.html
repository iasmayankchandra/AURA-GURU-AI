<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AURA GURU | Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 20%, rgba(212,175,55,0.16), transparent 30%),
        linear-gradient(135deg, #030303, #0b0b0b 50%, #020202);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .orb {
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(255,255,255,0.18) 0%,
        rgba(212,175,55,0.12) 25%,
        rgba(212,175,55,0.03) 55%,
        transparent 72%
      );
      filter: blur(5px);
      pointer-events: none;
    }

    .ring {
      position: fixed;
      width: 520px;
      height: 520px;
      border: 1px solid rgba(212,175,55,0.14);
      border-radius: 50%;
      box-shadow:
        0 0 50px rgba(212,175,55,0.06),
        inset 0 0 50px rgba(212,175,55,0.04);
      animation: rotate 18s linear infinite;
      pointer-events: none;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .container {
      width: 100%;
      max-width: 440px;
      padding: 20px;
      position: relative;
      z-index: 2;
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand h1 {
      font-size: 34px;
      letter-spacing: 5px;
      color: #d4af37;
      font-weight: 700;
    }

    .brand p {
      margin-top: 8px;
      color: #aaa;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .card {
      background: rgba(15,15,15,0.88);
      border: 1px solid rgba(212,175,55,0.25);
      border-radius: 24px;
      padding: 35px 30px;
      box-shadow:
        0 25px 80px rgba(0,0,0,0.65),
        0 0 40px rgba(212,175,55,0.05);
      backdrop-filter: blur(20px);
    }

    .tabs {
      display: flex;
      background: #080808;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 28px;
    }

    .tab {
      width: 50%;
      padding: 12px;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: #888;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .tab.active {
      background: linear-gradient(135deg, #d4af37, #f4d675);
      color: #050505;
    }

    .form-title {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .form-subtitle {
      color: #888;
      font-size: 13px;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      color: #bbb;
      font-size: 12px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border-radius: 11px;
      border: 1px solid #292929;
      background: #090909;
      color: white;
      outline: none;
      font-size: 14px;
      transition: 0.25s;
    }

    input:focus {
      border-color: #d4af37;
      box-shadow: 0 0 0 3px rgba(212,175,55,0.08);
    }

    .forgot {
      text-align: right;
      margin-top: -5px;
      margin-bottom: 20px;
    }

    .forgot a {
      color: #d4af37;
      font-size: 12px;
      text-decoration: none;
    }

    .main-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #c9a227, #f2d66d);
      color: #050505;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.25s;
      box-shadow: 0 10px 30px rgba(212,175,55,0.15);
    }

    .main-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(212,175,55,0.25);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0;
      color: #555;
      font-size: 11px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: #222;
      flex: 1;
    }

    .google-btn {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid #292929;
      background: #0b0b0b;
      color: #ddd;
      cursor: pointer;
      font-size: 13px;
    }

    .back {
      text-align: center;
      margin-top: 22px;
    }

    .back a {
      color: #999;
      text-decoration: none;
      font-size: 12px;
    }

    .back a:hover {
      color: #d4af37;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 500px) {
      .card {
        padding: 28px 20px;
      }

      .brand h1 {
        font-size: 28px;
      }

      .ring {
        width: 380px;
        height: 380px;
      }
    }
  </style>
</head>

<body>

  <div class="orb"></div>
  <div class="ring"></div>

  <div class="container">

    <div class="brand">
      <h1>AURA GURU</h1>
      <p>YOUR PERSONAL AI MENTOR</p>
    </div>

    <div class="card">

      <div class="tabs">
        <button class="tab active" id="loginTab" onclick="showLogin()">
          Login
        </button>

        <button class="tab" id="signupTab" onclick="showSignup()">
          Create Account
        </button>
      </div>

      <!-- LOGIN -->

      <div id="loginForm">

        <h2 class="form-title">Welcome Back</h2>

        <p class="form-subtitle">
          Continue your journey with AURA GURU.
        </p>

        <div class="field">
          <label>Email Address</label>
          <input
            type="email"
            id="loginEmail"
            placeholder="Enter your email"
          >
        </div>

        <div class="field">
          <label>Password</label>
          <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
          >
        </div>

        <div class="forgot">
          <a href="#" onclick="forgotPassword()">Forgot Password?</a>
        </div>

        <button class="main-btn" onclick="loginUser()">
          Enter AURA GURU
        </button>

        <div class="divider">OR</div>

        <button class="google-btn" onclick="googleLogin()">
          Continue with Google
        </button>

      </div>


      <!-- SIGNUP -->

      <div id="signupForm" class="hidden">

        <h2 class="form-title">Begin Your Journey</h2>

        <p class="form-subtitle">
          Create your AURA GURU account and start building your next version.
        </p>

        <div class="field">
          <label>Full Name</label>
          <input
            type="text"
            id="signupName"
            placeholder="Enter your name"
          >
        </div>

        <div class="field">
          <label>Email Address</label>
          <input
            type="email"
            id="signupEmail"
            placeholder="Enter your email"
          >
        </div>

        <div class="field">
          <label>Create Password</label>
          <input
            type="password"
            id="signupPassword"
            placeholder="Create a password"
          >
        </div>

        <button class="main-btn" onclick="createAccount()">
          Create My AURA
        </button>

      </div>

      <div class="back">
        <a href="index.html">← Back to AURA GURU</a>
      </div>

    </div>

  </div>


  <script>

    function showLogin() {

      document.getElementById("loginForm").classList.remove("hidden");
      document.getElementById("signupForm").classList.add("hidden");

      document.getElementById("loginTab").classList.add("active");
      document.getElementById("signupTab").classList.remove("active");

    }


    function showSignup() {

      document.getElementById("loginForm").classList.add("hidden");
      document.getElementById("signupForm").classList.remove("hidden");

      document.getElementById("loginTab").classList.remove("active");
      document.getElementById("signupTab").classList.add("active");

    }


    function loginUser() {

      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value.trim();

      if (!email || !password) {
        alert("Please enter your email and password.");
        return;
      }

      alert(
        "Login interface is ready. Secure authentication will be connected in the next step."
      );

    }


    function createAccount() {

      const name = document.getElementById("signupName").value.trim();
      const email = document.getElementById("signupEmail").value.trim();
      const password = document.getElementById("signupPassword").value.trim();

      if (!name || !email || !password) {
        alert("Please fill all fields.");
        return;
      }

      alert(
        "Account interface is ready. Secure account creation will be connected in the next step."
      );

    }


    function forgotPassword() {

      alert("Password recovery will be connected with secure authentication.");

    }


    function googleLogin() {

      alert("Google authentication will be connected in the next step.");

    }

  </script>

</body>
</html>
